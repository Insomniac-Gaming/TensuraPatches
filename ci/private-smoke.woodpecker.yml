when:
  - event: [push, manual, cron]

steps:
  - name: fetch-public-source
    image: alpine:3.20
    environment:
      SOURCE_REPO_URL: https://github.com/Insomniac-Gaming/TensuraPatches.git
    commands:
      - apk add --no-cache git ca-certificates
      - git clone --depth 1 --branch main "$SOURCE_REPO_URL" source
      - git -C source rev-parse HEAD

  - name: build-smoke-artifacts
    image: eclipse-temurin:21-jdk
    commands:
      - cd source && ./gradlew build :title-probe:build --no-daemon

  - name: server-start
    image: python:3.12-alpine
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /srv/insomniac-server-patches-ci:/ci-input:ro
    commands:
      - apk add --no-cache docker-cli
      - |
        set -eu
        if [ -f /ci-input/world.zip ]; then
          python source/ci/smoke.py server --snapshot /ci-input/server --world /ci-input/world.zip --jar source/build/libs/InsomniacServerPatches-1.0.0.jar
        else
          python source/ci/smoke.py server --snapshot /ci-input/server --jar source/build/libs/InsomniacServerPatches-1.0.0.jar
        fi

  - name: client-title-screen
    image: python:3.12-alpine
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /srv/insomniac-server-patches-ci:/ci-input:ro
    environment:
      PRISM_PROFILE:
        from_secret: prism_profile
    commands:
      - apk add --no-cache docker-cli
      - docker build -f source/ci/Dockerfile.client -t insomniac-client-smoke:11.1.1 source
      - |
        python source/ci/smoke.py client \
          --prism-root /ci-input/prism \
          --instance-id 'Tensura by Insomniac Gaming' \
          --profile "$PRISM_PROFILE" \
          --jar source/build/libs/InsomniacServerPatches-1.0.0.jar \
          --probe source/ci/title-probe/build/libs/InsomniacTitleProbe-1.0.0.jar
