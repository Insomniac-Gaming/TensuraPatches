plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.144'
}

version = '1.0.0'
group = 'com.insomniacgaming.ci'

base {
    archivesName = 'InsomniacTitleProbe'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = '21.1.262'
    mods {
        insomniac_title_probe {
            sourceSet(sourceSets.main)
        }
    }
}
