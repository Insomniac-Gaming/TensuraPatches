name: Build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release mod and CI probe
        run: ./gradlew clean build :title-probe:build --no-daemon

      - name: Test smoke input handling
        run: python3 -m unittest discover -s ci -p 'test_*.py'

      - name: Upload release mod
        uses: actions/upload-artifact@v4
        with:
          name: InsomniacServerPatches
          path: build/libs/InsomniacServerPatches-*.jar
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: InsomniacServerPatches
          path: dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jar="dist/InsomniacServerPatches-${GITHUB_REF_NAME#v}.jar"
          test -f "$jar" || { echo "Tag version does not match the built JAR" >&2; exit 1; }
          gh release create "$GITHUB_REF_NAME" "$jar" --verify-tag --generate-notes --repo "$GITHUB_REPOSITORY"
