name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  statuses: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require a tested main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$commit" origin/main || {
            echo "The tagged commit is not on main" >&2
            exit 1
          }
          python3 ci/release_gate.py "$GITHUB_REPOSITORY" "$commit" ci/woodpecker/push/tests

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare release notes
        run: python3 ci/release_notes.py --version "${GITHUB_REF_NAME#v}" --output release-notes.md

      - name: Build release JAR
        run: ./gradlew clean jar --no-daemon

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          jar="build/libs/InsomniacServerPatches-${GITHUB_REF_NAME#v}.jar"
          test -f "$jar" || { echo "Tag version does not match the built JAR" >&2; exit 1; }
          gh release create "$GITHUB_REF_NAME" "$jar" --verify-tag --notes-file release-notes.md --repo "$GITHUB_REPOSITORY"
