name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  statuses: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require a tested main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          main="$(git rev-parse origin/main)"
          if [ "$main" != "$commit" ]; then
            [ "$(git rev-parse "$main^" 2>/dev/null)" = "$commit" ] || {
              echo "The tag must point to the current tested main commit" >&2
              exit 1
            }
          fi
          python3 ci/release_gate.py "$GITHUB_REPOSITORY" "$main" ci/woodpecker/push/tests "${GITHUB_REF_NAME#v}"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release JAR
        run: ./gradlew clean jar --no-daemon

      - name: Compile changelog and release notes
        run: python3 ci/release_notes.py --release "${GITHUB_REF_NAME#v}" --output release-notes.md

      - name: Push compiled changelog
        run: |
          set -euo pipefail
          git fetch origin main
          tagged="$(git rev-parse HEAD)"
          main="$(git rev-parse origin/main)"
          if [ "$main" != "$tagged" ]; then
            git diff --quiet "$main" -- CHANGELOG.md changes || {
              echo "Main changed after the tag; cannot push the compiled changelog" >&2
              exit 1
            }
            echo "Compiled changelog already exists on main"
            exit 0
          fi
          git add -- CHANGELOG.md changes
          version="${GITHUB_REF_NAME#v}"
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "Compile changelog for v${version} [skip ci]"
          git push origin HEAD:main

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          jar="build/libs/InsomniacServerPatches-${GITHUB_REF_NAME#v}.jar"
          test -f "$jar" || { echo "Tag version does not match the built JAR" >&2; exit 1; }
          gh release create "$GITHUB_REF_NAME" "$jar" --verify-tag --notes-file release-notes.md --repo "$GITHUB_REPOSITORY"
