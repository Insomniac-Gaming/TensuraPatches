when:
  - event: push
    branch: main
  - event: pull_request
    branch: main
  - event: manual
    branch: main

steps:
  - name: build-artifacts
    image: eclipse-temurin:21-jdk
    commands:
      - ./gradlew clean build :title-probe:build :player-test-mod:build --no-daemon

  - name: unit-tests
    image: python:3.12-alpine
    commands:
      - apk add --no-cache git
      - python3 -m unittest discover -s ci -p 'test_*.py'

  - name: server-start
    image: python:3.12-alpine
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - insomniac-ci-input:/ci-input:ro
    commands:
      - apk add --no-cache docker-cli
      - |
        set -eu
        set -- build/libs/InsomniacServerPatches-*.jar
        [ "$#" -eq 1 ] && [ -f "$1" ] || { echo "Expected exactly one release JAR" >&2; exit 1; }
        jar="$1"
        if [ -f /ci-input/world.zip ]; then
          python3 ci/smoke.py server --snapshot /ci-input/server --world /ci-input/world.zip --jar "$jar"
        else
          python3 ci/smoke.py server --snapshot /ci-input/server --jar "$jar"
        fi

  - name: client-title-screen
    image: python:3.12-alpine
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - insomniac-ci-input:/ci-input:ro
    environment:
      PRISM_PROFILE:
        from_secret: prism_profile
    commands:
      - apk add --no-cache docker-cli
      - docker build -f ci/Dockerfile.client -t insomniac-client-smoke:11.1.1 .
      - |
        set -eu
        set -- build/libs/InsomniacServerPatches-*.jar
        [ "$#" -eq 1 ] && [ -f "$1" ] || { echo "Expected exactly one release JAR" >&2; exit 1; }
        jar="$1"
        set -- ci/title-probe/build/libs/InsomniacTitleProbe-*.jar
        [ "$#" -eq 1 ] && [ -f "$1" ] || { echo "Expected exactly one title probe JAR" >&2; exit 1; }
        python3 ci/smoke.py client \
          --prism-root /ci-input/prism \
          --instance-id 'Tensura by Insomniac Gaming' \
          --profile "$PRISM_PROFILE" \
          --jar "$jar" \
          --probe "$1"

  - name: player-tests
    image: python:3.12-alpine
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - insomniac-ci-input:/ci-input:ro
    environment:
      PRISM_PROFILE:
        from_secret: prism_profile
    commands:
      - apk add --no-cache docker-cli
      - python3 -m pip install --no-cache-dir pillow==11.3.0
      - |
        set -eu
        set -- build/libs/InsomniacServerPatches-*.jar
        [ "$#" -eq 1 ] && [ -f "$1" ] || { echo "Expected exactly one release JAR" >&2; exit 1; }
        jar="$1"
        set -- ci/title-probe/build/libs/InsomniacTitleProbe-*.jar
        [ "$#" -eq 1 ] && [ -f "$1" ] || { echo "Expected exactly one title probe JAR" >&2; exit 1; }
        probe="$1"
        set -- ci/player-test-mod/build/libs/InsomniacPlayerTests-*.jar
        [ "$#" -eq 1 ] && [ -f "$1" ] || { echo "Expected exactly one player-test JAR" >&2; exit 1; }
        test_mod="$1"
        docker build -f ci/Dockerfile.client -t insomniac-client-smoke:11.1.1 .
        python3 ci/player_tests/run.py all --snapshot /ci-input/server \
          --prism-root /ci-input/prism \
          --instance-id 'Tensura by Insomniac Gaming' --profile "$PRISM_PROFILE" \
          --jar "$jar" --probe "$probe" --test-mod "$test_mod"
