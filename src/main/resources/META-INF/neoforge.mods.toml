modLoader="javafml"
loaderVersion="[4,)"
license="Unlicense"

[[mods]]
modId="insomniac_server_patches"
version="0.2.0"
displayName="InsomniacServerPatches"
authors="Insomniac Gaming"
displayTest="IGNORE_SERVER_VERSION"
description='''
Compatibility patches for Tensura Horizons and SlimeThroneExtras. Restores
Tensura/ReRebirth reset and locking and hides SlimeThrone legacy controls.
'''

[[mixins]]
config="insomniac_server_patches.mixins.json"

[[mixins]]
config="insomniac_slimethrone.mixins.json"
requiredMods=["stextras"]

[[dependencies.insomniac_server_patches]]
modId="minecraft"
type="required"
versionRange="[1.21.1]"
ordering="NONE"
side="BOTH"

[[dependencies.insomniac_server_patches]]
modId="neoforge"
type="required"
versionRange="[21.1,)"
ordering="NONE"
side="BOTH"

[[dependencies.insomniac_server_patches]]
modId="tensurahorizons"
type="required"
versionRange="[0.31,0.32)"
ordering="AFTER"
side="BOTH"

# Keep the Horizons-only patch usable without SlimeThrone installed.
[[dependencies.insomniac_server_patches]]
modId="stextras"
type="optional"
versionRange="[2.1.2.1]"
ordering="AFTER"
side="BOTH"
