pluginManagement {
    repositories {
        mavenCentral()
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'InsomniacServerPatches'
include 'title-probe'
project(':title-probe').projectDir = file('ci/title-probe')
include 'player-test-mod'
project(':player-test-mod').projectDir = file('ci/player-test-mod')
